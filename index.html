<style>
:root{--bg:#f6f7fb;--c:#fff;--t:#1d2433;--m:#5b6478;--a:#2457d6;--b:#e2e6f0}
*{box-sizing:border-box}body{margin:0;font:16px/1.4 system-ui,Segoe UI,sans-serif;background:var(--bg);color:var(--t)}
header{position:sticky;top:0;background:var(--bg);padding:14px 16px 8px;z-index:5;border-bottom:1px solid var(--b)}
h1{margin:0 0 8px;font-size:20px}
#q{width:100%;font-size:20px;padding:12px 14px;border:2px solid var(--a);border-radius:10px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;align-items:center}
.chips b{font-size:13px;color:var(--m);margin-right:2px}
.chip{border:1px solid var(--b);background:var(--c);border-radius:20px;padding:5px 12px;cursor:pointer;font-size:14px}
.chip.on{background:var(--a);color:#fff;border-color:var(--a)}
main{padding:14px 16px 40px;display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px}
.card{background:var(--c);border:1px solid var(--b);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:8px}
.card h2{margin:0;font-size:17px}.ic{font-size:26px;margin-right:6px}
.r{color:var(--m);font-size:14px;flex:1}.tags{font-size:12px;color:var(--m)}
.btns{display:flex;gap:6px;flex-wrap:wrap}
a.bt,button.bt{background:var(--a);color:#fff;border:0;border-radius:8px;padding:8px 14px;font-size:15px;text-decoration:none;cursor:pointer}
a.bt.s,button.bt.s{background:#e8edfb;color:var(--a)}
.fav{margin-left:auto;background:none;border:0;font-size:20px;cursor:pointer}
details{font-size:14px}details ol{margin:6px 0 0;padding-left:20px}
code{background:#eef1f8;padding:1px 5px;border-radius:4px}
#n{padding:6px 16px;color:var(--m);font-size:14px}
</style></head><body>

pp_EPS_api.html"}, {"id": "exposes", "nom": "Exposés et recherche", "icone": "🔬", "resume": "Recherche scientifique des élèves : idée centrale, sources, expériences, résultats.", "type": "Applis à lancer", "matieres": ["Sciences"], "url": null, "url2": null, "prof": null, "local": true, "port": 8091, "autonome": "Pages HTML sans serveur : utilisables sur Chromebook, à mettre en ligne ou à copier.", "fichier": "apps/exposes/app-sources-exposes.html"}, {"id": "progressions", "nom": "Progressions", "icone": "🗂️", "resume": "Progressions et programmations de l'année (PDF et fiches).", "type": "Outils enseignant", "matieres": [], "url": null, "url2": null, "prof": null, "local": true, "port": null, "autonome": "Simples documents : se partagent tels quels."}, {"id": "cahier-journal", "nom": "Cahier Journal", "icone": "📓", "resume": "Planifier les séances, la programmation et l'emploi du temps.", "type": "Outils enseignant", "matieres": [], "url": null, "url2": null, "prof": null, "local": true, "port": 4000, "autonome": "Se livre seul : dossier cahier-journal + Node.js. Les liens avec les autres applis sont facultatifs."}, {"id": "correcteur", "nom": "Correcteur Pédagogique", "icone": "✏️", "resume": "Autocorrection orthographique, dictées et fluence pour les élèves.", "type": "Applis à lancer", "matieres": ["Français"], "url": null, "url2": null, "prof": null, "local": true, "port": 4100, "autonome": "Se livre seul en exe : build_exe.bat dans son dossier."}, {"id": "ecrits", "nom": "Écrits", "icone": "📝", "resume": "Les textes tapés par les élèves dans le Nuage : orthographe, bilan de contenu, notes.", "type": "Outils enseignant", "matieres": ["Français"], "url": null, "url2": null, "prof": null, "local": true, "port": 4300, "autonome": "Dépend du dossier Nuage des élèves et du Correcteur : à livrer avec lui."}, {"id": "atelier-exposes", "nom": "Atelier Exposés", "icone": "🎤", "resume": "Les élèves préparent un exposé à partir des animations et de documents choisis.", "type": "Applis à lancer", "matieres": ["Histoire", "Géographie", "Sciences"], "url": null, "url2": null, "prof": null, "local": true, "port": 8642, "autonome": "Dossier animations-cycle3-P1 + Node.js (voir LISEZMOI-expose.md)."}, {"id": "notes-et-suivi", "nom": "Notes & Suivi", "icone": "📊", "resume": "Évaluations, notes, observations et suivi de chaque élève.", "type": "Outils enseignant", "matieres": [], "url": null, "url2": null, "prof": null, "local": true, "port": 4200, "autonome": "Application installée (Electron), indépendante. Ses données restent dans %APPDATA%\\Notes et Suivi."}, {"id": "voyage-centre-terre", "nom": "Voyage au centre de la Terre", "icone": "🌋", "resume": "Jeu dont on est le héros, épisodes 1 et 2 : chemins multiples, cinq niveaux.", "type": "Applis à lancer", "matieres": ["Français", "Sciences", "Mathématiques"], "url": null, "url2": null, "prof": null, "local": true, "port": 8093, "autonome": "Pages HTML sans serveur : jouable sur Chromebook. Ne jamais joindre le fichier cles-api.local."}, {"id": "escape-games", "nom": "Escape games", "icone": "🗝️", "resume": "Les escape games d'histoire, géographie, EMC et sciences, avec pilotage de la classe.", "type": "Applis à lancer", "matieres": ["Histoire", "Géographie", "EMC", "Sciences"], "url": "https://idgir.github.io/escape-games-cm1-cm2/", "url2": null, "prof": null, "local": true, "port": 8000, "autonome": "Déjà en ligne pour les Chromebooks ; hors ligne : lancer.bat ou les archives du dossier archives-hors-ligne."}];
const TYPES=["Jeux élèves","Animations","Outils enseignant","Applis à lancer"];
const sans=s=>(s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase();
let fav=[];try{fav=JSON.parse(localStorage.getItem("fav")||"[]")}catch(e){}
const sauve=()=>{try{localStorage.setItem("fav",JSON.stringify(fav))}catch(e){}};
let ft=null,fm=null,onlyFav=false;
const mats=[...new Set(D.flatMap(d=>d.matieres||[]))].sort();
function chips(id,label,vals,get,set){const el=document.getElementById(id);el.innerHTML="<b>"+label+"</b>";
 [["Tout",null],...vals.map(v=>[v,v])].forEach(([t,v])=>{const b=document.createElement("button");b.className="chip"+(get()===v?" on":"");b.textContent=t;
 b.onclick=()=>{set(v);draw()};el.appendChild(b)})}
function esc(s){return (s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function draw(){
 chips("ft","Type",TYPES.concat(["★ Favoris"]),()=>onlyFav?"★ Favoris":ft,v=>{onlyFav=v==="★ Favoris";ft=onlyFav?null:v});
 chips("fm","Matière",mats,()=>fm,v=>fm=v);
 const q=sans(document.getElementById("q").value).split(/\s+/).filter(Boolean);
 const l=D.filter(d=>(!ft||d.type===ft)&&(!fm||(d.matieres||[]).includes(fm))&&(!onlyFav||fav.includes(d.id))
  &&q.every(w=>sans([d.nom,d.resume,d.type,(d.matieres||[]).join(" ")].join(" ")).includes(w)))
  .sort((a,b)=>(fav.includes(b.id)-fav.includes(a.id)));
 document.getElementById("n").textContent=l.length+" résultat"+(l.length>1?"s":"");
 document.getElementById("g").innerHTML=l.map(d=>{
  let b="";
  if(d.fichier)b+=`<a class="bt" href="${esc(d.fichier)}" target="_blank">▶ Ouvrir</a>`;
  if(d.url)b+=`<a class="bt" href="${esc(d.url)}" target="_blank" rel="noopener">▶ Ouvrir</a>`;
  if(d.url2)b+=`<a class="bt s" href="${esc(d.url2)}" target="_blank" rel="noopener">${esc(d.url2_nom||"Autre version")}</a>`;
  if(d.prof)b+=`<a class="bt s" href="${esc(d.prof)}" target="_blank" rel="noopener">Fiche prof</a>`;
  let det="";
  if(d.local&&!d.fichier)det=`<details><summary>${d.url?"Version locale (hors ligne)":"Comment le lancer"}</summary><ol>
   <li>Dossier <code>APPLICATIONS</code> → double-clic sur <code>Portail-Enseignant.bat</code></li>
   <li>Page « Applications » → cliquer sur <b>${esc(d.nom)}</b></li>
   ${d.port?`<li>Déjà lancé ? <a href="http://localhost:${d.port}/" target="_blank">http://localhost:${d.port}/</a></li>`:""}</ol>
   ${d.autonome?`<div class="tags">${esc(d.autonome)}</div>`:""}</details>`;
  return `<div class="card"><h2><span class="ic">${d.icone||"🧩"}</span>${esc(d.nom)}
   <button class="fav" title="Favori" onclick="tf('${d.id}')">${fav.includes(d.id)?"★":"☆"}</button></h2>
   <div class="r">${esc(d.resume)}</div><div class="tags">${esc(d.type)}${(d.matieres||[]).length?" · "+esc(d.matieres.join(", ")):""}</div>
   <div class="btns">${b}</div>${det}</div>`}).join("")||"<p>Rien trouvé : essayez un autre mot.</p>";
}
function tf(id){fav=fav.includes(id)?fav.filter(x=>x!==id):fav.concat(id);sauve();draw()}
document.getElementById("q").addEventListener("input",draw);
document.addEventListener("keydown",e=>{if(e.key==="/"&&document.activeElement.id!=="q"){e.preventDefault();document.getElementById("q").focus()}});
draw();
</script></body></html>
